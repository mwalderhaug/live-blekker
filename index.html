<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live-blekker</title>
<meta name="theme-color" content="#15120e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Live-blekker">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preload" href="fonts/source-sans-3-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-semi-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Fontene ligger i appen, så alt virker uten nett. */
@font-face{font-family:"Source Sans 3";font-style:normal;font-display:swap;font-weight:200 900;src:url(fonts/source-sans-3-latin-wght-normal.woff2) format("woff2")}
@font-face{font-family:"Source Sans 3";font-style:italic;font-display:swap;font-weight:200 900;src:url(fonts/source-sans-3-latin-wght-italic.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-display:swap;font-weight:500;src:url(fonts/barlow-semi-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-display:swap;font-weight:600;src:url(fonts/barlow-semi-condensed-latin-600-normal.woff2) format("woff2")}
/* Synk-status og oppkobling */
.sync{font-family:var(--f-ch);font-weight:500;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--chord)}
.sync.wait::before{background:#d9b35f}.sync.bad{color:var(--warn-fg)}.sync.bad::before{background:var(--warn-line)}
.setup{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:620px;line-height:1.5}
.setup h2{font-family:var(--f-ch);font-weight:600;font-size:22px;margin:0 0 8px}
.setup p{color:var(--muted);margin:0 0 14px}
.setup label{display:block;font-family:var(--f-ch);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.setup input{width:100%}
.setup .row{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.setup .err{color:var(--warn-fg);margin-top:12px}
.setup .tip{margin-top:16px;font-size:15px;border-top:1px solid var(--line);padding-top:12px}
/* Endringer som venter på å bli sendt: prikk på «Oversikt» (ikke i Live) */
html[data-q] .bar:not(.lbar) .back::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#d9b35f;margin-left:8px;vertical-align:middle}
/* Notestativ på scenen: én sang = én skjerm, kolonner tilpasses automatisk, energistripe langs hver del. Bevisst kun mørkt tema (scenebruk). */
:root{
  color-scheme:dark;
  --bg:#15120e; --panel:#1e1913; --raise:#292219; --line:#3b3329;
  --fg:#ede5d7; --muted:#9b9080; --chord:#a9c79b;
  --warn-bg:#3d1913; --warn-fg:#ffb7a5; --warn-line:#a9412f;
  --kon:#dd5549; --kw:#e9e2d5; --kb:#120f0b; --kl:#5f574c;
  --e0:#3a332b; --e1:#6f9f7a; --e2:#a3b46a; --e3:#d6a94c; --e4:#dd8045; --e5:#d9514a;
  --k-vers:#7fa893; --k-pre:#66aaa4; --k-ref:#a2cc7e; --k-bro:#c4c066; --k-ins:#8b8274;  --f-lyr:"Source Sans 3","Helvetica Neue",Arial,sans-serif;
  --f-ch:"Barlow Semi Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-lyr);margin:0;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
body.live{overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.live #app{touch-action:pan-y}
#app{min-height:100%}
html{-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,textarea,select,a{touch-action:manipulation}
.btn{font-family:var(--f-ch);font-weight:600;font-size:16px;letter-spacing:.02em;background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-height:40px;-webkit-tap-highlight-color:transparent}
.btn.on{border-color:var(--chord);color:var(--chord)}
.btn:active{background:var(--line);transform:scale(.97)}
.btn.ghost{background:transparent}
/* Live-knapp: kontur i salvie, liten trekant (SVG, så iOS ikke gjør den til emoji) */
.btn.live,.btn.lv{background:transparent;border-color:var(--chord);color:var(--chord);display:inline-flex;align-items:center;gap:.45em}
.btn.live:disabled{opacity:.4}
.pl{width:.62em;height:.72em;fill:currentColor;flex:none}
/* Vanlig visning: verktøyene på egen rad, rolige knapper */
.bar>.tools{order:5;flex-basis:100%;justify-content:flex-start}
.vt .btn{background:transparent;min-height:38px;font-size:15px;padding:5px 12px}
/* Live: hele skjermen til blekka. Trykk viser menyen som et lag over. */
body.golive #app{padding-top:8px}
.lov{position:fixed;left:0;right:0;top:0;z-index:40;background:rgba(21,18,14,.97);border-bottom:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));transform:translateY(-105%);transition:transform .18s ease-out;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.lov.on{transform:none}
.lov .bar{padding:0}
.lov .lbar .ttl{white-space:normal;font-size:24px;line-height:1.15}
.lov .lbar .lmeta{margin-left:0;display:block;font-size:16px;margin-top:2px}
.lov .kbtn{order:3;min-height:42px;font-size:20px;padding:0 14px}
.lov .qk{margin:10px 0 0}
.lpill{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:35;pointer-events:none;background:rgba(41,34,25,.96);border:1px solid var(--line);border-radius:999px;
  padding:6px 16px;font-family:var(--f-ch);font-weight:600;font-size:17px;color:var(--fg);white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;opacity:0;animation:lpill 2.4s ease-out forwards}
.lpill b{color:var(--chord);font-weight:600}
.lpill .h{color:var(--muted);font-weight:500}
@keyframes lpill{0%{opacity:0}10%{opacity:1}75%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.lov{transition:none}}
.btn.danger{border-color:var(--warn-line);color:var(--warn-fg)}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--chord);outline-offset:2px}
input,textarea,select{font-family:var(--f-lyr);font-size:16px;background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;box-sizing:border-box;max-width:100%}
textarea{width:100%;line-height:1.45;resize:vertical}
.lbl{font-family:var(--f-ch);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* Oversikt */
.home{max-width:920px;margin:0 auto;padding:20px 0 48px}
.hh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
.htabs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.htab{font-family:var(--f-ch);font-weight:600;font-size:17px;letter-spacing:.02em;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:6px 20px;min-height:44px}
.htab.on{background:var(--raise);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.htab .ct{font-size:14px;font-weight:500;color:var(--muted);margin-left:7px;font-variant-numeric:tabular-nums}
.th{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 12px;min-height:40px}
.th h2{font-family:var(--f-ch);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.th+.th,.past{margin-top:26px}
.scard{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.scard.next{border-color:rgba(169,199,155,.5)}
.sc-main{flex:1 1 320px;min-width:0;display:flex;align-items:center;gap:16px;background:none;border:0;padding:0;text-align:left;color:var(--fg)}
.sc-date{flex:none;width:60px;height:60px;border-radius:12px;background:var(--raise);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.sc-date b{font-family:var(--f-ch);font-weight:600;font-size:27px;color:var(--chord)}
.sc-date span{font-family:var(--f-ch);font-weight:500;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.sc-body{min-width:0;display:flex;flex-direction:column;gap:3px}
.sc-name{font-size:21px;font-weight:500;line-height:1.15}
.sc-meta{font-family:var(--f-ch);font-weight:500;font-size:15px;color:var(--muted)}
.sc-meta .nx{color:var(--chord);font-weight:600}
.sc-songs{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-act{display:flex;gap:8px;flex:none;margin-left:auto}
.btn.live{min-width:88px;justify-content:center}
.past .scard{padding:8px 12px;background:transparent}
.past .sc-date{width:48px;height:48px}.past .sc-date b{font-size:21px}
.past .sc-name{font-size:18px}
.lsrch{margin:0 0 8px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.pn .ph{font-size:13px;color:var(--muted);margin:0 0 8px;line-height:1.4}
.pchs{display:flex;flex-wrap:wrap;gap:6px 8px}
.pch{display:flex;flex-direction:column;gap:1px;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-width:64px}
.pcn{font-family:var(--f-ch);font-weight:600;font-size:17px;color:var(--chord)}
.pcv{font-family:var(--f-ch);font-weight:500;font-size:15px;letter-spacing:.03em}
.pcv .op{color:var(--muted)}
.pch .bs{font-size:12px;color:var(--muted)}
.pcom{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;margin-top:10px}
.pcom .pl{font-size:13px;color:var(--muted)}
.pcom .big{font-family:var(--f-ch);font-weight:600;font-size:22px;color:var(--kon);letter-spacing:.04em}
.pcom .alm{font-family:var(--f-ch);font-weight:600;font-size:17px;color:var(--e3)}
.kal{fill:var(--kw);stroke:var(--e3);stroke-width:2}
.kbl{fill:#5a3b12;stroke:var(--e3);stroke-width:1.2}
.qk{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin:0 0 8px}
.qk .kv{font-family:var(--f-ch);font-weight:600;font-size:24px;color:var(--chord);min-width:46px;text-align:center}
.qk .hint{flex:1 1 200px}
.kbtn{font-family:var(--f-ch);font-weight:600;font-size:17px;color:var(--chord);background:transparent;border:1px solid var(--line);border-radius:6px;padding:0 8px;min-height:32px;margin-left:2px}
.kbtn.loc{border-color:var(--e3);color:var(--e3)}
.lbar .lmeta{display:inline-flex;align-items:center;gap:6px}
.swr{min-height:44px;margin-left:6px}
.swr.on{border-color:var(--e3);color:var(--e3)}
.dh{font-family:var(--f-ch);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}
button.prow{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:var(--fg);font:inherit;cursor:pointer}
.prow .st{width:6px;align-self:stretch;min-height:24px;border-radius:3px;background:var(--e0);flex:none}
.prow .chev{color:var(--muted);font-size:18px;margin-left:auto}
.dpan{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:6px 0 12px}
.dpan .fl .lbl{min-width:120px}
.ktop{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 22px}
.ktop .fld input{width:90px}
.lcl{background:var(--panel);border:1px solid var(--e3);border-radius:10px;padding:10px 14px;margin:0 0 16px;font-size:15px}
.lcl b{color:var(--e3)}
[hidden]{display:none!important}
label.btn{display:inline-flex;align-items:center;justify-content:center}
.brand .stag{color:#14110d}
.stag{font-family:var(--f-ch);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#14110d;background:var(--chord);border-radius:5px;padding:2px 7px;margin-left:10px;vertical-align:middle}
.dat{font-size:13px;color:var(--muted)}
.vtag{color:var(--muted);font-weight:400}
.hf{margin-top:40px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hf .lbl{margin-right:6px}
.vsel{font-family:var(--f-ch);font-size:15px;padding:5px 8px;max-width:150px}
.ehint{font-size:13px;color:var(--muted);margin:0 0 8px}
.ehint b{color:var(--fg);font-weight:600}
.lbar{padding:6px 0 4px}
.lbar .ttl{font-size:22px}
.lmeta{font-family:var(--f-ch);font-weight:500;font-size:17px;color:var(--muted);margin-left:10px}
.lmeta b{color:var(--chord);font-weight:600}
.lx.ask{border-color:var(--warn-line);color:var(--warn-fg)}
.cmpn{font-size:.72em;color:var(--chord);opacity:.85;font-style:italic}
.cmpm{font-size:.78em;color:var(--muted);font-style:italic;margin-bottom:.22em}
@media (max-width:600px){.htab{padding:6px 14px}.sc-act{width:100%}.sc-act .btn{flex:1}}
.brand{font-family:var(--f-ch);font-weight:600;font-size:32px;line-height:1;letter-spacing:.01em;margin:0}
.brand span{color:var(--chord)}
.sub{color:var(--muted);margin:6px 0 0;font-size:15px}
.grp{margin:0 0 28px}
.gh{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:4px}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.row .main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.date{font-family:var(--f-ch);font-weight:600;font-size:15px;color:var(--chord);min-width:92px;font-variant-numeric:tabular-nums}
.rt{font-size:18px}
.rm{color:var(--muted);font-size:14px}
.kchip{font-family:var(--f-ch);font-weight:600;color:var(--chord);font-size:15px;min-width:34px;text-align:right}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0 12px}
.box .it{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.box .it:last-of-type{border-bottom:0}
.box .it .n{flex:1;min-width:0}
.fl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.sm{min-height:34px;padding:4px 10px;font-size:15px}
.letter{font-family:var(--f-ch);font-weight:600;font-size:15px;color:var(--chord);letter-spacing:.06em;padding:20px 4px 4px;border-bottom:1px solid var(--line)}
.letter.first{padding-top:6px}
.tempo{font-family:var(--f-ch);font-weight:500;color:var(--muted);font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.srch{width:100%;margin-top:12px}
.reslist{max-height:280px;overflow-y:auto;margin-top:4px;-webkit-overflow-scrolling:touch}
.res{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 4px;font-size:16px;color:var(--fg)}
.res:last-child{border-bottom:0}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;color:var(--muted);line-height:1.5}

/* Sangvisning */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px 0 6px}
.bar .btn{min-height:42px}
.back{order:1;flex:none}
.tt{order:2;min-width:0;flex:1 1 160px}
.tools{order:3;display:flex;gap:6px;flex:none}
.navg{order:4;display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
.ic{min-width:42px;padding:0;font-size:22px;line-height:1}
.nxt{display:flex;align-items:center;gap:10px;text-align:left;width:230px;max-width:230px;padding:3px 10px 3px 12px}
.nxt .nw{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.15}
.nxt .n1{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.nxt .n2{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nxt .ar{font-size:24px;line-height:1;color:var(--chord)}
@media (max-width:899px){.tools{order:5;flex-basis:100%;justify-content:flex-end}}
@media (max-width:639px){.tt{flex-basis:calc(100% - 140px)}.tools{order:3;flex-basis:auto;justify-content:flex-start;gap:4px}.tools .btn{padding:4px 9px;font-size:15px}.navg{order:4;gap:4px}.pos{display:none}.nxt{width:150px;max-width:150px}}
.ttl{font-family:var(--f-ch);font-weight:600;font-size:23px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-family:var(--f-ch);font-size:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta b{color:var(--chord);font-weight:600}
.pos{font-family:var(--f-ch);font-weight:600;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.warn{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-fg);border-radius:8px;padding:7px 12px;margin:0 0 6px;font-family:var(--f-ch);font-weight:600;font-size:22px;letter-spacing:.02em}
.warn .wl{font-size:13px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.rig{font-size:14px;color:var(--muted);margin:0 0 6px;display:flex;flex-wrap:wrap;gap:4px 14px}
.rig .miss{color:var(--e3)}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px 10px;margin:0 0 8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.tab{flex:none;font-family:var(--f-ch);font-weight:600;font-size:14px;background:transparent;border:1px solid var(--line);border-radius:6px;padding:4px 10px;color:var(--muted);min-height:32px}
.tab.on{color:var(--fg);border-color:var(--chord)}
.dg{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:4px}
.dia .dn{font-family:var(--f-ch);font-weight:600;font-size:17px;color:var(--chord);margin-bottom:2px}
.dia svg{display:block}
.dia .nl{font-size:12px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.mv{color:var(--kon);font-weight:700}
.kw{fill:var(--kw);stroke:var(--kl);stroke-width:.6}
.kb{fill:var(--kb)}
.kon{fill:var(--kon)}
.kbs{fill:var(--chord)}
.held{font-size:13px;color:var(--muted);margin-top:6px}
.held b{color:var(--fg)}

.sheet{overflow:hidden;column-gap:2.2em;-webkit-column-gap:2.2em;column-rule:none;-webkit-column-rule:none;font-size:18px}
.sheet.scroll{overflow:visible;height:auto!important}
.sec{display:inline-block;width:100%;box-sizing:border-box;border-left:.2em solid var(--e0);padding:.05em 0 .1em .75em;margin:0 0 .8em;break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;--ec:var(--e0);--kc:var(--k-ins);border-radius:0}

/* ---------- voicing / pianohjelp ---------- */
function voiceSeq(list,shift){var prev=null,out=[];
  list.forEach(function(p){var pcs=tones(p).map(function(x){return md(x+shift);});var root=md(p.r+shift);
    if(pcs.length>4){var fifth=md(root+7);pcs=pcs.filter(function(x){return x!==fifth;}).slice(0,4);}
    var opts=pcs.map(function(pc){var a=[];for(var n=55;n<=79;n++)if(md(n)===pc)a.push(n);return a;});
    var best=null,bs=1e9;
    (function rec(i,acc){if(i===opts.length){var v=acc.slice().sort(function(a,b){return a-b;});var span=v[v.length-1]-v[0];if(span>12)return;
        var mean=v.reduce(function(a,b){return a+b;},0)/v.length;var sc;
        if(prev){sc=0;v.forEach(function(n){sc+=Math.min.apply(null,prev.map(function(q){return Math.abs(q-n);}));});prev.forEach(function(q){sc+=Math.min.apply(null,v.map(function(n){return Math.abs(q-n);}));});sc+=0.15*Math.abs(mean-66);}
        else sc=Math.abs(mean-66)+0.1*span;
        if(sc<bs){bs=sc;best=v;}return;}
      opts[i].forEach(function(n){acc.push(n);rec(i+1,acc);acc.pop();});})(0,[]);
    if(!best)best=pcs.map(function(pc){return 60+pc;}).sort(function(a,b){return a-b;});
    var bpc=md((p.b!=null?p.b:p.r)+shift),bass=null;for(var n=best[0]-1;n>=best[0]-12;n--)if(md(n)===bpc){bass=n;break;}
    out.push({v:best,bass:bass});prev=best;});
  return out;}
function keyboard(v,bass,lo,hi){var W=[0,2,4,5,7,9,11],w=8,h=40,x=0,wk="",bk="",dot="";
  for(var n=lo;n<hi;n++){var on=v.indexOf(n)>=0;
    if(W.indexOf(md(n))>=0){wk+='<rect class="'+(on?"kon":"kw")+'" x="'+x+'" y="0" width="'+w+'" height="'+h+'" rx="1"/>';if(n===bass)dot+='<circle class="kbs" cx="'+(x+w/2)+'" cy="'+(h-6)+'" r="2.4"/>';x+=w;}
    else{bk+='<rect class="'+(on?"kon":"kb")+'" x="'+(x-2.5)+'" y="0" width="5" height="25" rx="0.8"/>';if(n===bass)dot+='<circle class="kbs" cx="'+x+'" cy="19" r="2"/>';}}
  return '<svg width="'+(x+1)+'" height="'+(h+1)+'" viewBox="-0.5 -0.5 '+(x+1)+' '+(h+1)+'" role="img" aria-label="Tangenter">'+wk+bk+dot+'</svg>';}
/* Akkordhjelp for pads: alle akkordene i sangen med pad-grep, og hvilke toner som ligger i alle (eller nesten alle). */
function padVoice(p){var q=p.q.replace(/[()]/g,"");var minor=/^(m|min|-)(?!aj)/.test(q);var dim=/dim|°|m7b5/.test(q),aug=/aug|\+/.test(q);

  for(var n=0;n<12;n++){var r=red.indexOf(n)>=0,a=alm.indexOf(n)>=0;
    if(W.indexOf(n)>=0){wk+='<rect class="'+(r?"kon":a?"kal":"kw")+'" x="'+x+'" y="0" width="'+w+'" height="'+h+'" rx="2"/>';x+=w;}
    else bk+='<rect class="'+(r?"kon":a?"kbl":"kb")+'" x="'+(x-5)+'" y="0" width="10" height="40" rx="1.5"/>';}
  return '<svg width="'+(x+1)+'" height="'+(h+1)+'" viewBox="-0.5 -0.5 '+(x+1)+' '+(h+1)+'" role="img" aria-label="Felles toner">'+wk+bk+'</svg>';}
function panelHTML(song,ctx){var seen={},list=[];

  return '<div class="pn"><p class="ph">Alle akkordene i sangen med pad-grep: grunntone, kvint og fargetone (2, 4, 7). Tersen droppes på 2- og sus-akkorder; i parentes = valgfri ters.</p><div class="pchs">'+chips+'</div>'+com+'</div>';}

/* Finner største skrift (maks MAXF) og antall kolonner som får delen til å passe på én skjerm. Resultatet caches, så gamle iPader slipper å regne på nytt. */
function fitEl(sh,H,key){sh.classList.remove("scroll");sh.style.height=H+"px";
  var W=sh.clientWidth;var maxC=W>=1300?4:(W>=880?3:(W>=520?2:1));
  function cols(c){sh.style.columnCount=c;sh.style.webkitColumnCount=c;}
  var lns=sh.querySelectorAll(".ln");
  function lnOK(){for(var i=0;i<lns.length;i++)if(lns[i].scrollWidth>lns[i].clientWidth+1)return false;return true;}
  function noWrap(){for(var i=0;i<lns.length;i++){var l=lns[i];
      if(l.classList.contains("tx")){if(l.firstChild&&l.firstChild.getClientRects().length>1)return false;}
      else if(!l.classList.contains("bars")&&l.children.length>1&&l.lastElementChild.offsetTop>l.firstElementChild.offsetTop+2)return false;}return true;}
  function ok(f,nw){sh.style.fontSize=f+"px";return sh.scrollWidth<=sh.clientWidth+1&&sh.scrollHeight<=sh.clientHeight+1&&lnOK()&&(!nw||noWrap());}
  if(key&&key.f!=null){cols(key.c);if(!key.f){sh.style.fontSize="11px";sh.classList.add("scroll");return key;}return ok(key.f,false)?key:null;}
  function search(nw){var b=null;for(var c=1;c<=maxC;c++){cols(c);if(!ok(10,nw))continue;var lo=10,hi=MAXF;if(ok(hi,nw)){lo=hi;}else{while(hi-lo>0.4){var mid=(lo+hi)/2;if(ok(mid,nw))lo=mid;else hi=mid;}}
    if(!b||lo>b.f+0.8)b={f:lo,c:c};if(lo>=MAXF)break;}return b;}
  var best=search(false);var flat=best?search(true):null;if(flat&&flat.f>=best.f*0.84)best=flat;
  var res=best?{f:Math.floor(best.f*10)/10,c:best.c}:{f:0,c:maxC};
  cols(res.c);if(res.f)sh.style.fontSize=res.f+"px";else{sh.style.fontSize="11px";sh.classList.add("scroll");}
  return res;}
var CPF=16;
function fitSheet(sh,H,e,song){var mode=song.compact||"auto";var ctx=ctxFor(song,e.item);var part=partsOf(song)[e.part]||song.sections;
  sh.style.height=H+"px";var key=fitKey(e,song,sh.clientWidth,H)+"|"+mode;var hit=FC[key];

  function put(cp){if(cp===cpNow())return;sh.innerHTML=sheetInner(song,ctx,part,cp);sh.setAttribute("data-cp",cp?"1":"");}
  if(hit){put(!!hit.cp);var rh=fitEl(sh,H,hit);if(rh)return rh;}

    if(r2.f>=r1.f+0.8||(!r1.f&&r2.f)){r2.cp=true;res=r2;}else{put(false);fitEl(sh,H,r1);}}

function toStore(v,ctx){var p=parseChord(v);if(!p||!ctx.shift)return v;var nm=FLATKEY[S.draft.key]?FLAT:SHARP;
  return nm[md(p.r-ctx.shift)]+p.q+(p.b!=null?"/"+nm[md(p.b-ctx.shift)]:"");}
function setLine(si,li,L){S.draft.sections[si].lines[li]=lbuild(L);}
function atEnd(L,c){if(c.p>=L.t.length&&L.t.length&&!/\s$/.test(L.t)){L.t+=" ";c.p=L.t.length;}}
function cmove(d){var sc=selChord();if(!sc)return;var L=sc.L,c=sc.c,t=L.t,p=c.p,np=p;
  if(d===-1)np=Math.max(0,p-1);else if(d===1)np=Math.min(t.length,p+1);
  else{var ws=[];for(var i=0;i<t.length;i++)if(t.charAt(i)!==" "&&(i===0||t.charAt(i-1)===" "))ws.push(i);ws.push(t.length);
    if(d>0){np=t.length;for(var j=0;j<ws.length;j++)if(ws[j]>p){np=ws[j];break;}}else{np=0;for(var j2=ws.length-1;j2>=0;j2--)if(ws[j2]<p){np=ws[j2];break;}}}
  if(np===p)return;pushUndo();c.p=np;resort(L);S.csel.ci=L.c.indexOf(c);setLine(S.csel.si,S.csel.li,L);dirty();}
function cmoveTo(si,li,p){var s=S.csel,sc=selChord();if(!sc)return;
  if(s.si===si&&s.li===li){if(sc.c.p===p)return;pushUndo();sc.c.p=p;atEnd(sc.L,sc.c);resort(sc.L);S.csel.ci=sc.L.c.indexOf(sc.c);setLine(si,li,sc.L);}
  else{pushUndo();sc.L.c.splice(s.ci,1);setLine(s.si,s.li,sc.L);var L2=lparse(S.draft.sections[si].lines[li]);var nc={p:p,n:sc.c.n};atEnd(L2,nc);L2.c.push(nc);resort(L2);setLine(si,li,L2);S.csel={si:si,li:li,ci:L2.c.indexOf(nc)};}
  dirty();}
function cdel(){var sc=selChord();if(!sc)return;pushUndo();sc.L.c.splice(S.csel.ci,1);setLine(S.csel.si,S.csel.li,sc.L);S.csel=null;dirty();}
function crename(v,stored){var sc=selChord();if(!sc)return;var n=stored?v:toStore(normCh(v),editCtx());if(!n||n===sc.c.n)return;
  pushUndo(stored?null:"rn"+S.csel.si+"."+S.csel.li+"."+S.csel.ci);sc.c.n=n;setLine(S.csel.si,S.csel.li,sc.L);dirty();}
function cinsert(v,stored){var car=S.ccar;if(!car)return;var n=stored?v:toStore(normCh(v),editCtx());if(!n)return;pushUndo();
  var L=lparse(S.draft.sections[car.si].lines[car.li]);var nc={p:car.p,n:n};atEnd(L,nc);L.c.push(nc);resort(L);setLine(car.si,car.li,L);S.csel={si:car.si,li:car.li,ci:L.c.indexOf(nc)};S.ccar=null;dirty();}

   Blekkene ligger som JSON-filer i et privat repo (songs/<id>.json, setlists/<id>.json).
   Appen leser og skriver med en nøkkel (fine-grained token) som bare ligger på denne enheten.
   Endringer legges først i en kø her (lb.q) og sendes én og én så snart det er nett. */
var GH=null,Q={},GHS={sha:{},doc:{},tree:"",at:"",err:null,off:false,pulling:false,pumping:false,loaded:false},SUBS={songs:[],setlists:[]};
function ghLoad(){try{GH=JSON.parse(localStorage.getItem("lb.gh")||"null");}catch(e){GH=null;}
  try{var c=JSON.parse(localStorage.getItem("lb.ghc")||"null");if(c){GHS.sha=c.sha||{};GHS.doc=c.doc||{};GHS.tree=c.tree||"";GHS.at=c.at||"";}}catch(e){}
  try{Q=JSON.parse(localStorage.getItem("lb.q")||"{}")||{};}catch(e){Q={};}}
function ghSaveC(){try{localStorage.setItem("lb.ghc",JSON.stringify({sha:GHS.sha,doc:GHS.doc,tree:GHS.tree,at:GHS.at}));}catch(e){}}
function saveQ(){try{localStorage.setItem("lb.q",JSON.stringify(Q));}catch(e){toast("Får ikke lagret på enheten (lagringen er full).",true,5000);}}
function ghFetch(g,method,path,body,raw){var h={"Authorization":"Bearer "+g.t,"Accept":raw?"application/vnd.github.raw+json":"application/vnd.github+json"};
  var o={method:method,headers:h};if(body){h["Content-Type"]="application/json";o.body=JSON.stringify(body);}
  return fetch("https://api.github.com/repos/"+g.repo+path,o);}
function api(m,p,b,raw){return ghFetch(GH,m,p,b,raw);}
function b64e(str){var b=new TextEncoder().encode(str),r="";for(var i=0;i<b.length;i+=0x8000)r+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(r);}
function devName(){var u=navigator.userAgent||"";return /iPad|iPhone/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1)?"iPad":"Mac";}
function fpath(p){return "/contents/"+p.split("/").map(encodeURIComponent).join("/");}
function colOf(p){var m=/^(songs|setlists)\/(.+)\.json$/.exec(p);return m?{c:m[1],id:m[2]}:null;}
function snapFor(col){var docs=[],seen={};
  function add(p,d){var o=colOf(p);if(!o||o.c!==col||d==null)return;seen[p]=1;docs.push({id:o.id,exists:true,data:function(){return clone(d);}});}
  Object.keys(GHS.doc).forEach(function(p){var q=Q[p];if(q){if(q.d!==null)add(p,q.d);seen[p]=1;}else add(p,GHS.doc[p]);});
  Object.keys(Q).forEach(function(p){if(!seen[p])add(p,Q[p].d);});
  return {docs:docs};}
function emit(){if(!GHS.loaded)return;["songs","setlists"].forEach(function(c){var sn=snapFor(c);SUBS[c].forEach(function(f){f(sn);});});showSync();}
function hhmm(s){var d=new Date(s);if(isNaN(d))return "";var p=function(n){return (n<10?"0":"")+n;};var t=new Date();return (d.toDateString()===t.toDateString()?"":d.getDate()+". "+MON[d.getMonth()]+" ")+"kl. "+p(d.getHours())+":"+p(d.getMinutes());}
function syncInfo(){if(!GH)return null;var n=Object.keys(Q).length;
  if(GHS.err==="auth")return {c:"bad",t:"Nøkkelen virker ikke – koble til på nytt"};
  if(GHS.err==="norepo")return {c:"bad",t:"Fant ikke repoet"};
  if(GHS.err==="perm")return {c:"bad",t:"Nøkkelen mangler tillatelse (Contents)"};
  if(n)return {c:"wait",t:n+" "+(n===1?"endring":"endringer")+(GHS.off?" venter på nett":" sendes …")};
  if(GHS.off)return {c:"wait",t:"Uten nett · viser lagret kopi"+(GHS.at?" fra "+hhmm(GHS.at):"")};
  return {c:"ok",t:"Alt er lagret"+(GHS.at?" · hentet "+hhmm(GHS.at):"")};}
function showSync(){var el=$("sync"),i=syncInfo();if(el&&i){el.className="sync "+i.c;el.textContent=i.t;}
  var n=GH?Object.keys(Q).length:0;try{if(n)document.documentElement.setAttribute("data-q",GHS.off?"off":"on");else document.documentElement.removeAttribute("data-q");}catch(e){}}
var ghdb={collection:function(c){return {onSnapshot:function(ok){SUBS[c].push(ok);if(GHS.loaded)ok(snapFor(c));return function(){};}};},
  doc:function(path){var p=path+".json";return {
    set:function(d){Q[p]={d:clone(d)};saveQ();kick();return Promise.resolve();},
    delete:function(){Q[p]={d:null};saveQ();kick();return Promise.resolve();}};}};
function kick(ms){clearTimeout(kick.t);kick.t=setTimeout(pump,ms==null?1200:ms);showSync();}
async function ghPull(force){if(!GH||GHS.pulling)return;GHS.pulling=true;
  try{var r=await api("GET","/git/trees/"+encodeURIComponent(GH.br||"main")+"?recursive=1&t="+Date.now());
    if(r.status===401){GHS.err="auth";render();return;}
    if(r.status===403){GHS.err="perm";render();return;}
    if(r.status===404||r.status===409){var r2=await api("GET","?t="+Date.now());
      if(r2.status===401||r2.status===403){GHS.err="auth";render();return;}
      if(r2.status===404){GHS.err="norepo";render();return;}
      if(r2.ok){var info=await r2.json();if(r.status===404&&info.default_branch&&info.default_branch!==GH.br){GH.br=info.default_branch;try{localStorage.setItem("lb.gh",JSON.stringify(GH));}catch(x){}GHS.pulling=false;return ghPull(force);}}
      else{GHS.off=true;showSync();return;}
      GHS.err=null;GHS.off=false;GHS.tree="";GHS.sha={};GHS.doc={};GHS.at=new Date().toISOString();GHS.loaded=true;ghSaveC();emit();return;}
    if(!r.ok){GHS.off=true;showSync();return;}
    var j=await r.json();GHS.err=null;GHS.off=false;
    if(j.sha===GHS.tree&&GHS.loaded&&!force){GHS.at=new Date().toISOString();ghSaveC();showSync();return;}
    var want={};(j.tree||[]).forEach(function(e){if(e.type==="blob"&&colOf(e.path))want[e.path]=e.sha;});
    var need=Object.keys(want).filter(function(p){return GHS.sha[p]!==want[p]||!GHS.doc[p];});var got={},bad=[];
    for(var i=0;i<need.length;i+=6){await Promise.all(need.slice(i,i+6).map(async function(p){var b=await api("GET","/git/blobs/"+want[p],null,true);if(!b.ok)throw new Error("blob "+b.status);
      var txt=await b.text();try{got[p]=JSON.parse(txt);}catch(x){bad.push(p);}}));}
    var doc={},sha={};Object.keys(want).forEach(function(p){if(got[p]){doc[p]=got[p];sha[p]=want[p];}else if(GHS.doc[p]&&bad.indexOf(p)<0){doc[p]=GHS.doc[p];sha[p]=want[p];}else if(GHS.doc[p]){doc[p]=GHS.doc[p];sha[p]=want[p];}});
    GHS.doc=doc;GHS.sha=sha;GHS.tree=j.sha;GHS.at=new Date().toISOString();GHS.loaded=true;ghSaveC();emit();
    if(bad.length)toast("Kunne ikke lese "+bad.map(function(p){return p.replace(/\.json$/,"");}).join(", ")+" (feil i fila)",true,5000);}
  catch(e){GHS.off=true;showSync();}
  finally{GHS.pulling=false;}}
async function pump(){if(!GH||GHS.pumping||GHS.err==="auth"||GHS.err==="perm")return;if(!Object.keys(Q).length){showSync();return;}GHS.pumping=true;showSync();
  try{for(;;){var ks=Object.keys(Q);if(!ks.length)break;var p=ks[0],it=Q[p];var res=await pushOne(p,it,false);
      if(res!=="ok"){if(res==="auth"||res==="perm"){GHS.err=res;render();}else GHS.off=true;break;}
      GHS.off=false;if(Q[p]===it){delete Q[p];saveQ();}}}
  finally{GHS.pumping=false;showSync();if(Object.keys(Q).length&&!GHS.off&&GHS.err!=="auth"&&GHS.err!=="perm")kick(4000);}}
async function pushOne(p,it,retry){
  function code(st){return st===401?"auth":st===403?"perm":"off";}
  try{var url=fpath(p),del=it.d===null,msg=(del?"Slett ":"Oppdater ")+p.replace(/\.json$/,"")+" ("+devName()+")";
    var body={message:msg};if(!del)body.content=b64e(JSON.stringify(it.d,null,2)+"\n");
    if(GHS.sha[p])body.sha=GHS.sha[p];
    if(del&&!body.sha){var g=await api("GET",url+"?t="+Date.now());if(g.status===404){delete GHS.doc[p];ghSaveC();return "ok";}if(!g.ok)return code(g.status);body.sha=(await g.json()).sha;}
    var r=await api(del?"DELETE":"PUT",url,body);
    if(r.ok){if(del){delete GHS.sha[p];delete GHS.doc[p];}else{var j=await r.json();GHS.sha[p]=j.content&&j.content.sha;GHS.doc[p]=clone(it.d);}GHS.tree="";ghSaveC();return "ok";}
    if((r.status===409||r.status===422||(del&&r.status===404))&&!retry){
      /* Fila er endret fra en annen enhet (eller finnes ikke): hent gjeldende versjon og skriv over med denne endringen. */
      var g2=await api("GET",url+"?t="+Date.now());
      if(g2.status===404)delete GHS.sha[p];else if(g2.ok)GHS.sha[p]=(await g2.json()).sha;else return code(g2.status);
      if(del&&!GHS.sha[p]){delete GHS.doc[p];ghSaveC();return "ok";}
      return pushOne(p,it,true);}
    return code(r.status);}
  catch(e){return "off";}}
function setupHTML(msg){var u=navigator.userAgent||"";var ipad=/iPad|iPhone/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1);
  return '<div class="setup"><h2>Koble til blekkene dine</h2><p>Blekkene ligger i et privat GitHub-repo. Lim inn nøkkelen én gang på denne enheten, så hentes og lagres alt der.</p>'+
    '<label for="gh-t">Nøkkel</label><input id="gh-t" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="github_pat_…">'+
    '<label for="gh-r">Repo</label><input id="gh-r" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="'+esc((GH&&GH.repo)||S.ghRepo||"mwalderhaug/live-blekker-data")+'">'+
    '<div class="row"><button class="btn pri" data-act="ghconnect"'+(S.ghBusy?" disabled":"")+'>'+(S.ghBusy?"Kobler til …":"Koble til")+'</button></div>'+
    ((msg||S.ghErr)?'<p class="err">'+esc(msg||S.ghErr)+'</p>':"")+
    (ipad&&!standalone()?'<p class="tip">Legg appen til på Hjem-skjermen først (Del → «Legg til på Hjem-skjerm») og koble til derfra. Safari og Hjem-skjerm-appen husker hver sin nøkkel.</p>':"")+
    '<p class="tip">Nøkkelen lagres bare på denne enheten og gir bare tilgang til blekke-repoet.</p></div>';}
async function ghConnect(){var ti=$("gh-t"),ri=$("gh-r");var t=ti?ti.value.trim():"",repo=(ri?ri.value.trim():"").replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/+$/,"");
  S.ghRepo=repo;if(!t){S.ghErr="Lim inn nøkkelen først.";render();return;}if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){S.ghErr="Repoet skrives som eier/navn, f.eks. mwalderhaug/live-blekker-data.";render();return;}
  S.ghBusy=true;S.ghErr=null;render();
  try{var r=await ghFetch({t:t,repo:repo},"GET","?t="+Date.now());
    if(r.status===401){S.ghErr="Nøkkelen er feil eller utløpt.";}
    else if(r.status===404||r.status===403){S.ghErr="Fant ikke repoet med denne nøkkelen. Sjekk at nøkkelen har tilgang til «"+repo+"».";}
    else if(!r.ok){S.ghErr="GitHub svarte ikke ("+r.status+"). Prøv igjen.";}
    else{var info=await r.json();var br=info.default_branch||"main";
      var tr=await ghFetch({t:t,repo:repo},"GET","/git/trees/"+encodeURIComponent(br)+"?t="+Date.now());
      if(tr.status===403){S.ghErr="Nøkkelen mangler tillatelsen «Contents». Rediger nøkkelen på GitHub: Repository permissions → Contents → Read and write → Update. Last så inn siden på nytt.";S.ghBusy=false;render();return;}
      GH={t:t,repo:repo,br:br};try{localStorage.setItem("lb.gh",JSON.stringify(GH));}catch(x){}
      S.ghBusy=false;GHS.err=null;startGH();toast("Koblet til",false,2500);return;}}
  catch(e){S.ghErr="Får ikke kontakt med GitHub. Sjekk nettet.";}
  S.ghBusy=false;render();}
function startGH(){S.db=ghdb;S.err=null;
  ghdb.collection("songs").onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){if(d.exists)m[d.id]=busy("songs/"+d.id)&&S.songs[d.id]?S.songs[d.id]:d.data();});Object.keys(S.songs).forEach(function(id){if(!m[id]&&busy("songs/"+id))m[id]=S.songs[id];});S.songs=m;S.got.songs=true;S.fresh=true;S.slow=false;if(!S.edit)render();});
  ghdb.collection("setlists").onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){if(d.exists)m[d.id]=busy("setlists/"+d.id)&&S.sets[d.id]?S.sets[d.id]:d.data();});Object.keys(S.sets).forEach(function(id){if(!m[id]&&busy("setlists/"+id))m[id]=S.sets[id];});S.sets=m;S.got.sets=true;S.freshSets=true;if(!S.edit)render();});
  if(GHS.at){GHS.loaded=true;emit();}else render();
  ghPull().then(function(){pump();});}
window.addEventListener("online",function(){if(!GH)return;GHS.off=false;pump();ghPull();});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&GH){pump();ghPull();}});
setInterval(function(){if(!GH||document.visibilityState!=="visible")return;if(Object.keys(Q).length)pump();else if(!S.live&&!S.edit)ghPull();},60000);

/* ---------- oppstart ---------- */
function use(n){try{if(window.claude&&typeof window.claude.use==="function")return Promise.resolve(window.claude.use(n));}catch(e){}return Promise.resolve(null);}
function cache(){}
if(SCENE){(function(){try{KO=JSON.parse(localStorage.getItem("lb.keys")||"{}")||{};}catch(e){KO={};}var emb=window.__SCENE,imp=null;try{imp=JSON.parse(localStorage.getItem("lb.import")||"null");}catch(e){}
  var d=(imp&&imp.songs&&imp.setlists&&String(imp.at||"")>String(emb.at||""))?imp:emb;S.songs=d.songs||{};S.sets=d.setlists||emb.setlists||{};S.dataAt=d.at||"";S.got.songs=S.got.sets=true;render();})();}
else{
ghLoad();if(GH)startGH();else render();
setTimeout(function(){if(GH&&!S.got.songs&&!GHS.err){S.slow=true;render();}},10000);
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(function(){});
}
})();
</script>
